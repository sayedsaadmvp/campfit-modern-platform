name: Validate and Deploy Platform

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/platform.yml"
      - "platform/**"
      - "infrastructure/**"
      - "scripts/**"
      - "Directory.*.props"
      - "global.json"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore and build AppHost
        run: |
          dotnet restore platform/CampFit.AppHost/CampFit.AppHost.csproj
          dotnet build platform/CampFit.AppHost/CampFit.AppHost.csproj --configuration Release --no-restore

      - name: Build Bicep template
        uses: azure/cli@v2
        with:
          inlineScript: az bicep build --file infrastructure/main.bicep

  deploy:
    if: github.event_name == 'workflow_dispatch'
    needs: validate
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Azure login with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Validate existing resources and deploy Container Apps
        uses: azure/cli@v2
        with:
          inlineScript: |
            az deployment group create \
              --name "campfit-platform-${GITHUB_RUN_ID}" \
              --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
              --template-file infrastructure/main.bicep \
              --parameters \
                location="${{ vars.AZURE_LOCATION }}" \
                containerAppsEnvironmentName="${{ vars.AZURE_CONTAINER_APPS_ENVIRONMENT }}" \
                containerRegistryName="${{ vars.AZURE_CONTAINER_REGISTRY_NAME }}" \
                keyVaultName="${{ vars.AZURE_KEY_VAULT_NAME }}" \
                userAssignedIdentityName="${{ vars.AZURE_USER_ASSIGNED_IDENTITY_NAME }}" \
                postgresHost="${{ vars.AZURE_POSTGRES_HOST }}" \
                coreImage="${{ vars.CORE_IMAGE }}" \
                adventureImage="${{ vars.ADVENTURE_IMAGE }}" \
                bffImage="${{ vars.BFF_IMAGE }}" \
                analyticsImage="${{ vars.ANALYTICS_IMAGE }}" \
                bffAllowedCorsOrigin="${{ vars.BFF_ALLOWED_CORS_ORIGIN }}"

      - name: Verify public BFF
        shell: bash
        run: |
          BFF_FQDN="$(az containerapp show \
            --name campfit-bff-mobile \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --query properties.configuration.ingress.fqdn \
            --output tsv)"
          curl --fail --retry 12 --retry-delay 10 --retry-all-errors "https://${BFF_FQDN}/health"
          echo "BFF URL: https://${BFF_FQDN}" >> "${GITHUB_STEP_SUMMARY}"
